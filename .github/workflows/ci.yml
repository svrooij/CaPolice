name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  pull_request:

jobs:
  build:
    name: Build & format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.x'

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Restore tools
        run: dotnet tool restore

      - name: Build untagged version
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: dotnet build --no-restore -c Release

      - name: Set module version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          Write-Host "Setting module version to $version"
          (Get-Content src/CaPolice/CaPolice.psd1) -replace 'ModuleVersion = ".*"', "ModuleVersion = '$version'" | Set-Content src/CaPolice/CaPolice.psd1

      - name: Build tagged version
        if: startsWith(github.ref, 'refs/tags/')
        run: dotnet build --no-restore -c Release -p:Version=$("${{ github.ref_name }}".Substring(1))

      - name: Format check
        run: dotnet format --verify-no-changes

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: module-release
          path: src/CaPolice/bin/Release/net8.0/
          retention-days: 1

  test-module:
    name: Pester module tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      checks: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: module-release
          path: src/CaPolice/bin/Release/net8.0/

      # - name: Install Pester
      #   shell: pwsh
      #   run: Install-Module Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser

      - name: Import module
        shell: pwsh
        run: Import-Module ./src/CaPolice/bin/Release/net8.0/CaPolice.psd1 -Force -ErrorAction Stop

      - name: Run Pester tests
        shell: pwsh
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.TestResult.Enabled = $true
          $cfg.TestResult.OutputFormat = 'JUnitXml'
          $cfg.TestResult.OutputPath = 'test-results.xml'
          Invoke-Pester -Configuration $cfg

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}  
        with:
          name: Pester results
          path: test-results.xml
          reporter: java-junit
          fail-on-error: true

  publish-psgallery:
    name: 📦 Publish CaPolice to PowerShell Gallery
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, test-module]
    steps:
      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: module-release
          path: dist/CaPolice/

      - name: 🧪 Import module
        shell: pwsh
        run: |
          Import-Module ./dist/CaPolice/CaPolice.psd1
          Get-Command -Module CaPolice

      - name: 📦 Publish CaPolice to PowerShell Gallery
        shell: pwsh
        run: |
          Import-Module ./dist/CaPolice/CaPolice.psd1
          Publish-Module -Path ./dist/CaPolice -NuGetApiKey $env:PSGALLERY_TOKEN -Repository PSGallery -Force
        env:
          PSGALLERY_TOKEN: ${{ secrets.PSGALLERY_TOKEN }}