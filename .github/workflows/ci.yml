name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    name: Build & format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Restore tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Format check
        run: dotnet format --verify-no-changes

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: module-release
          path: src/CaPolice/bin/Release/net8.0/
          retention-days: 1

  test-module:
    name: Pester module tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      checks: write

    steps:
      - uses: actions/checkout@v4

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: module-release
          path: src/CaPolice/bin/Release/net8.0/

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser

      - name: Import module
        shell: pwsh
        run: Import-Module ./src/CaPolice/bin/Release/net8.0/CaPolice.psd1 -Force -ErrorAction Stop

      - name: Run Pester tests
        shell: pwsh
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.TestResult.Enabled = $true
          $cfg.TestResult.OutputFormat = 'JUnitXml'
          $cfg.TestResult.OutputPath = 'test-results.xml'
          Invoke-Pester -Configuration $cfg

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Pester results
          path: test-results.xml
          reporter: java-junit
          fail-on-error: true
